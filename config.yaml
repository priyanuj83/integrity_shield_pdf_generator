# IntegrityShield Configuration

# Dataset sources
datasets:
  gsm8k_mcq:
    source: "local"
    path: "data/gsm_mcq"
    type: "math"
    format: "jsonl"
  
  mbpp_plus:
    source: "huggingface"
    repo: "Muennighoff/mbpp"
    config: "full"
    type: "coding"
    format: "dataset"
  
  mmlu_abstract_algebra:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "abstract_algebra"
    type: "social_science"
    format: "dataset"
  
  mmlu_all:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "all"
    type: "social_science"
    format: "dataset"
  
  mmlu_anatomy:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "anatomy"
    type: "stem"
    format: "dataset"
  
  mmlu_pro:
    source: "huggingface"
    repo: "TIGER-Lab/MMLU-Pro"
    config: "default"
    type: "comprehensive"
    format: "dataset"
  
  # Hierarchical subject mappings (combining MMLU + MMLU-Pro)
  
  # Mathematics Hierarchical Mappings
  mmlu_math_k12:
    subjects: ["elementary_mathematics", "high_school_mathematics", "high_school_statistics"]
    type: "stem"
    domain: "Mathematics"
    academic_level: "K-12"
  
  mmlu_math_undergrad:
    subjects: ["abstract_algebra", "college_mathematics"]
    type: "stem"
    domain: "Mathematics"
    academic_level: "Undergraduate"
  
  mmlu_math_grad:
    subjects: ["math"]
    type: "stem"
    domain: "Mathematics"
    academic_level: "Graduate"
  
  # Physics Hierarchical Mappings
  mmlu_physics_k12:
    subjects: ["high_school_physics", "conceptual_physics"]
    type: "stem"
    domain: "Physics"
    academic_level: "K-12"
  
  mmlu_physics_undergrad:
    subjects: ["college_physics"]
    type: "stem"
    domain: "Physics"
    academic_level: "Undergraduate"
  
  mmlu_physics_grad:
    subjects: ["physics"]
    type: "stem"
    domain: "Physics"
    academic_level: "Graduate"
  
  # Chemistry Hierarchical Mappings
  mmlu_chemistry_k12:
    subjects: ["high_school_chemistry"]
    type: "stem"
    domain: "Chemistry"
    academic_level: "K-12"
  
  mmlu_chemistry_undergrad:
    subjects: ["college_chemistry"]
    type: "stem"
    domain: "Chemistry"
    academic_level: "Undergraduate"
  
  mmlu_chemistry_grad:
    subjects: ["chemistry"]
    type: "stem"
    domain: "Chemistry"
    academic_level: "Graduate"
  
  # Biology Hierarchical Mappings
  mmlu_biology_k12:
    subjects: ["high_school_biology"]
    type: "stem"
    domain: "Biology"
    academic_level: "K-12"
  
  mmlu_biology_undergrad:
    subjects: ["college_biology"]
    type: "stem"
    domain: "Biology"
    academic_level: "Undergraduate"
  
  mmlu_biology_grad:
    subjects: ["biology", "anatomy"]
    type: "stem"
    domain: "Biology"
    academic_level: "Graduate"
  
  # Computer Science Hierarchical Mappings
  mmlu_cs_k12:
    subjects: ["high_school_computer_science"]
    type: "stem"
    domain: "Computer Science"
    academic_level: "K-12"
  
  mmlu_cs_undergrad:
    subjects: ["college_computer_science", "computer science"]
    type: "stem"
    domain: "Computer Science"
    academic_level: "Undergraduate"
  
  mmlu_cs_grad:
    subjects: ["computer science"]
