# IntegrityShield Configuration

# Dataset sources
datasets:
  gsm8k_mcq:
    source: "local"
    path: "data/gsm_mcq"
    type: "math"
    format: "jsonl"
  
  mbpp_plus:
    source: "huggingface"
    repo: "Muennighoff/mbpp"
    config: "full"
    type: "coding"
    format: "dataset"
  
  mmlu_abstract_algebra:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "abstract_algebra"
    type: "social_science"
    format: "dataset"
  
  mmlu_all:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "all"
    type: "social_science"
    format: "dataset"
  
  mmlu_anatomy:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "anatomy"
    type: "stem"
    format: "dataset"
  
  mmlu_pro:
    source: "huggingface"
    repo: "TIGER-Lab/MMLU-Pro"
    config: "default"
    type: "comprehensive"
    format: "dataset"
  
  ai2_arc:
    source: "huggingface"
    repo: "allenai/ai2_arc"
    config: "ARC-Challenge"
    type: "science"
    format: "dataset"
    academic_level: "K-12"
  
  squad:
    source: "huggingface"
    repo: "rajpurkar/squad"
    config: "plain_text"
    type: "reading_comprehension"
    format: "dataset"
  
  # Hierarchical subject mappings (combining MMLU + MMLU-Pro)
  
  # Mathematics Hierarchical Mappings
  mmlu_math_k12:
    subjects: ["elementary_mathematics", "high_school_mathematics", "high_school_statistics"]
    type: "stem"
    domain: "Mathematics"
    academic_level: "K-12"
  
  mmlu_math_undergrad:
    subjects: ["abstract_algebra", "college_mathematics"]
    type: "stem"
    domain: "Mathematics"
    academic_level: "Undergraduate"
  
  mmlu_math_grad:
    subjects: ["math"]
    type: "stem"
    domain: "Mathematics"
    academic_level: "Graduate"
  
  # Physics Hierarchical Mappings
  mmlu_physics_undergrad:
    subjects: ["college_physics"]
    type: "stem"
    domain: "Physics"
    academic_level: "Undergraduate"
  
  mmlu_physics_grad:
    subjects: ["physics"]
    type: "stem"
    domain: "Physics"
    academic_level: "Graduate"
  
  # Chemistry Hierarchical Mappings
  mmlu_chemistry_undergrad:
    subjects: ["college_chemistry"]
    type: "stem"
    domain: "Chemistry"
    academic_level: "Undergraduate"
  
  mmlu_chemistry_grad:
    subjects: ["chemistry"]
    type: "stem"
    domain: "Chemistry"
    academic_level: "Graduate"
  
  # Biology Hierarchical Mappings
  mmlu_biology_undergrad:
    subjects: ["college_biology", "biology"]  # "college_biology" for MMLU, "biology" for MMLU-Pro
    type: "stem"
    domain: "Biology"
    academic_level: "Undergraduate"
  
  mmlu_biology_grad:
    subjects: ["biology", "anatomy"]
    type: "stem"
    domain: "Biology"
    academic_level: "Graduate"
  
  # AI2-ARC Science Hierarchical Mappings
  arc_science_k12:
    subjects: ["science"]
    type: "science"
    domain: "Science"
    academic_level: "K-12"
  
  # Computer Science Hierarchical Mappings
  mmlu_cs_k12:
    subjects: ["high_school_computer_science"]
    type: "stem"
    domain: "Computer Science"
    academic_level: "K-12"
  
  mmlu_cs_undergrad:
    subjects: ["college_computer_science", "high_school_computer_science"]
    type: "stem"
    domain: "Computer Science"
    academic_level: "Undergraduate"
  
  mmlu_cs_grad:
    subjects: ["college_computer_science", "computer_security"]
    type: "stem"
    domain: "Computer Science"
    academic_level: "Graduate"
  
  # Economics Hierarchical Mappings
  mmlu_economics_k12:
    subjects: ["high_school_macroeconomics", "high_school_microeconomics"]
    type: "social_science"
    domain: "Economics"
    academic_level: "K-12"
  
  mmlu_economics_undergrad:
    subjects: ["econometrics", "economics"]
    type: "social_science"
    domain: "Economics"
    academic_level: "Undergraduate"
  
  mmlu_economics_grad:
    subjects: ["economics"]
    type: "social_science"
    domain: "Economics"
    academic_level: "Graduate"
  
  # Psychology Hierarchical Mappings
  mmlu_psychology_k12:
    subjects: ["high_school_psychology"]
    type: "social_science"
    domain: "Psychology"
    academic_level: "K-12"
  
  mmlu_psychology_undergrad:
    subjects: ["professional_psychology", "psychology"]
    type: "social_science"
    domain: "Psychology"
    academic_level: "Undergraduate"
  
  mmlu_psychology_grad:
    subjects: ["psychology"]
    type: "social_science"
    domain: "Psychology"
    academic_level: "Graduate"
  
  # Law Hierarchical Mappings
  mmlu_law_undergrad:
    subjects: ["international_law", "jurisprudence"]
    type: "legal"
    domain: "Constitutional Law"
    academic_level: "Undergraduate"
  
  mmlu_law_grad:
    subjects: ["professional_law", "law"]
    type: "legal"
    domain: "Constitutional Law"
    academic_level: "Graduate"
  
  # Philosophy Hierarchical Mappings
  mmlu_philosophy_undergrad:
    subjects: ["philosophy", "formal_logic", "logical_fallacies", "moral_disputes", "moral_scenarios"]
    type: "humanities"
    domain: "Philosophy"
    academic_level: "Undergraduate"
  
  mmlu_philosophy_grad:
    subjects: ["philosophy"]
    type: "humanities"
    domain: "Philosophy"
    academic_level: "Graduate"
  
  # Health/Medical Hierarchical Mappings
  mmlu_health_k12:
    subjects: ["nutrition"]
    type: "medical"
    domain: "Health Sciences"
    academic_level: "K-12"
  
  mmlu_health_undergrad:
    subjects: ["anatomy", "human_aging", "human_sexuality", "medical_genetics", "virology"]
    type: "medical"
    domain: "Health Sciences"
    academic_level: "Undergraduate"
  
  mmlu_health_grad:
    subjects: ["clinical_knowledge", "college_medicine", "professional_medicine", "health"]
    type: "medical"
    domain: "Health Sciences"
    academic_level: "Graduate"
  
  # Business Hierarchical Mappings
  mmlu_business_undergrad:
    subjects: ["business_ethics", "management", "marketing", "public_relations"]
    type: "business"
    domain: "Business Administration"
    academic_level: "Undergraduate"
  
  mmlu_business_grad:
    subjects: ["professional_accounting", "business"]
    type: "business"
    domain: "Business Administration"
    academic_level: "Graduate"
  
  # History Hierarchical Mappings
  mmlu_history_k12:
    subjects: ["high_school_european_history", "high_school_us_history", "high_school_world_history", "prehistory"]
    type: "humanities"
    domain: "History"
    academic_level: "K-12"
  
  mmlu_history_undergrad:
    subjects: ["global_facts", "history"]
    type: "humanities"
    domain: "History"
    academic_level: "Undergraduate"
  
  mmlu_history_grad:
    subjects: ["history"]
    type: "humanities"
    domain: "History"
    academic_level: "Graduate"
  
  # Astronomy Hierarchical Mappings (Graduate level only - advanced subject)
  mmlu_astronomy_grad:
    subjects: ["astronomy"]
    type: "stem"
    domain: "Astronomy"
    academic_level: "Graduate"
  
  # Geography Hierarchical Mappings
  mmlu_geography_k12:
    subjects: ["high_school_geography"]
    type: "social_science"
    domain: "Geography"
    academic_level: "K-12"
  
  mmlu_geography_undergrad:
    subjects: ["global_facts"]
    type: "social_science"
    domain: "Geography"
    academic_level: "Undergraduate"
  
  # Sociology Hierarchical Mappings
  mmlu_sociology_undergrad:
    subjects: ["sociology"]
    type: "social_science"
    domain: "Sociology"
    academic_level: "Undergraduate"
  
  # Political Science Hierarchical Mappings
  mmlu_political_science_undergrad:
    subjects: ["high_school_government_and_politics", "security_studies", "us_foreign_policy"]
    type: "social_science"
    domain: "Political Science"
    academic_level: "Undergraduate"
  
  # Religious Studies Hierarchical Mappings
  
  # Machine Learning/AI Hierarchical Mappings
  mmlu_ai_undergrad:
    subjects: ["machine_learning"]
    type: "stem"
    domain: "Machine Learning"
    academic_level: "Undergraduate"
  
  # Cybersecurity Hierarchical Mappings
  mmlu_cybersecurity_undergrad:
    subjects: ["computer_security"]
    type: "stem"
    domain: "Cybersecurity"
    academic_level: "Undergraduate"
  
  # Realistic K-12 Mappings (only for appropriate domains)
  mmlu_economics_k12:
    subjects: ["high_school_macroeconomics", "high_school_microeconomics"]
    type: "social_science"
    domain: "Economics"
    academic_level: "K-12"
  
  mmlu_health_k12:
    subjects: ["nutrition"]
    type: "medical"
    domain: "Health Sciences"
    academic_level: "K-12"
  
  # Missing Graduate Mappings
  mmlu_geography_grad:
    subjects: ["global_facts"]
    type: "social"
    domain: "Geography"
    academic_level: "Graduate"
  
  mmlu_sociology_grad:
    subjects: ["sociology"]
    type: "social"
    domain: "Sociology"
    academic_level: "Graduate"
  
  mmlu_political_science_grad:
    subjects: ["security_studies", "us_foreign_policy"]
    type: "social"
    domain: "Political Science"
    academic_level: "Graduate"
  
  mmlu_religious_studies_k12:
    subjects: ["world_religions"]
    type: "humanities"
    domain: "Religious Studies"
    academic_level: "K-12"
  
  mmlu_machine_learning_undergrad:
    subjects: ["machine_learning"]
    type: "stem"
    domain: "Machine Learning"
    academic_level: "Undergraduate"
  
  mmlu_machine_learning_grad:
    subjects: ["machine_learning"]
    type: "stem"
    domain: "Machine Learning"
    academic_level: "Graduate"
  
  # Missing Machine Learning K-12 mapping
  mmlu_machine_learning_k12:
    subjects: ["machine_learning"]
    type: "stem"
    domain: "Machine Learning"
    academic_level: "K-12"
  
  mmlu_cybersecurity_grad:
    subjects: ["computer_security"]
    type: "stem"
    domain: "Cybersecurity"
    academic_level: "Graduate"
  

# Document generation settings
document_generation:
  total_documents: 40
  initial_batch: 5
  marks_per_document: 40
  
  # Domain generation settings
  domain_generation:
    enabled: true  # Enable domain-specific papers
    use_hierarchical_system: true  # Use hierarchical academic level system
    domains_to_generate: [
      "science", "mathematics", "physics", "chemistry", "biology",
      "computer_science", "engineering", "economics", "psychology", 
      "philosophy", "health_sciences", "business_administration", "history", "geography",
      "sociology", "political_science", "religious_studies", 
      "machine_learning", "cybersecurity", "astronomy", "constitutional_law"
    ]
    academic_levels: ["K-12", "Undergraduate", "Graduate"]
    
    # Realistic academic level mappings for each domain
    domain_academic_levels:
      # Domains with K-12 only
      science: ["K-12"]
      religious_studies: ["K-12"]
      
      # Domains with K-12, Undergraduate, Graduate
      mathematics: ["K-12", "Undergraduate", "Graduate"]
      computer_science: ["K-12", "Undergraduate", "Graduate"]
      economics: ["K-12", "Undergraduate", "Graduate"]
      health_sciences: ["K-12", "Undergraduate", "Graduate"]
      history: ["K-12", "Undergraduate", "Graduate"]
      geography: ["K-12", "Undergraduate", "Graduate"]
      
      # Domains with Undergraduate, Graduate only (no K-12)
      physics: ["Undergraduate", "Graduate"]
      chemistry: ["Undergraduate", "Graduate"]
      biology: ["Undergraduate", "Graduate"]
      engineering: ["Undergraduate", "Graduate"]
      psychology: ["Undergraduate", "Graduate"]
      philosophy: ["Undergraduate", "Graduate"]
      business_administration: ["Undergraduate", "Graduate"]
      constitutional_law: ["Undergraduate", "Graduate"]
      sociology: ["Undergraduate", "Graduate"]
      political_science: ["Undergraduate", "Graduate"]
      machine_learning: ["Undergraduate", "Graduate"]
      cybersecurity: ["Undergraduate", "Graduate"]
      
      # Domains with Graduate only (advanced subjects)
      astronomy: ["Graduate"]

    # SQuAD Domain Keyword Mappings
    squad_history:
      title_keywords: ["history", "battle", "war", "revolution", "empire", "dynasty", "civilization", "ancient", "medieval", "century", "historical"]
      context_keywords: ["historical", "ancient", "medieval", "century", "battle", "war"]
      type: "reading_comprehension"
      domain: "History"
      academic_level: ["K-12", "Undergraduate", "Graduate"]
    
    squad_geography:
      title_keywords: ["geography", "country", "city", "river", "mountain", "continent", "region", "capital", "population", "climate", "ocean", "sea", "lake", "desert", "forest", "island", "peninsula", "valley", "plateau", "coast", "border", "territory", "nation", "state", "province", "location", "africa", "asia", "europe", "america", "australia", "antarctica", "atlantic", "pacific", "indian", "arctic", "mediterranean", "nile", "amazon", "mississippi", "yangtze", "ganges", "himalayas", "alps", "andes", "rockies", "sahara", "arctic", "tropic", "equator", "latitude", "longitude", "hemisphere", "timezone", "urban", "rural", "metropolitan", "migration", "settlement", "colony", "empire", "kingdom", "republic", "democracy", "federation", "union"]
      context_keywords: ["geographical", "population", "climate", "region", "country", "location", "territory", "border", "coast", "coastal", "inland", "northern", "southern", "eastern", "western", "central", "tropical", "temperate", "arctic", "equatorial", "urban", "rural", "metropolitan", "settlement", "migration", "demographics", "census", "area", "land", "water", "elevation", "altitude", "latitude", "longitude", "hemisphere", "timezone", "geographic", "geopolitical", "territorial", "national", "international", "continental", "regional", "local", "global"]
      type: "reading_comprehension"
      domain: "Geography"
      academic_level: ["K-12", "Undergraduate", "Graduate"]
    
    squad_political_science:
      title_keywords: ["government", "politics", "election", "democracy", "republic", "political", "parliament", "constitution", "policy", "legislative"]
      context_keywords: ["political", "government", "democracy", "election", "policy", "constitution"]
      type: "reading_comprehension"
      domain: "Political Science"
      academic_level: ["Undergraduate", "Graduate"]
    
    squad_sociology:
      title_keywords: ["society", "social", "culture", "demographics", "sociology", "community", "institution", "social_movement", "societal"]
      context_keywords: ["social", "society", "cultural", "demographics", "community"]
      type: "reading_comprehension"
      domain: "Sociology"
      academic_level: ["Undergraduate", "Graduate"]
    
    squad_economics:
      title_keywords: ["economics", "economy", "market", "trade", "finance", "economic", "GDP", "inflation", "currency", "banking"]
      context_keywords: ["economic", "economy", "market", "trade", "financial"]
      type: "reading_comprehension"
      domain: "Economics"
      academic_level: ["K-12", "Undergraduate", "Graduate"]
    
    squad_health:
      title_keywords: ["health", "medicine", "medical", "disease", "treatment", "healthcare", "public_health", "nutrition"]
      context_keywords: ["health", "medical", "disease", "treatment", "healthcare"]
      type: "reading_comprehension"
      domain: "Health Sciences"
      academic_level: ["K-12", "Undergraduate", "Graduate"]
    
    squad_business:
      title_keywords: ["business", "company", "corporation", "management", "marketing", "finance", "entrepreneurship", "commerce"]
      context_keywords: ["business", "company", "management", "commercial", "corporate"]
      type: "reading_comprehension"
      domain: "Business Administration"
      academic_level: ["Undergraduate", "Graduate"]
    
    squad_philosophy:
      title_keywords: ["philosophy", "philosophical", "ethics", "logic", "metaphysics", "philosopher", "philosophical_theory"]
      context_keywords: ["philosophical", "philosophy", "ethical", "logical", "metaphysical"]
      type: "reading_comprehension"
      domain: "Philosophy"
      academic_level: ["Undergraduate", "Graduate"]
    
    squad_religious_studies:
      title_keywords: ["religion", "religious", "theology", "faith", "spiritual", "worship", "sacred", "religious_text"]
      context_keywords: ["religious", "religion", "theological", "spiritual", "faith"]
      type: "reading_comprehension"
      domain: "Religious Studies"
      academic_level: ["K-12"]

      
    papers_per_domain_level: 25  # Generate 25 papers per domain-level combination
    use_legacy_combinations: false  # Use hierarchical combinations instead
  
  # Hierarchical domain combinations (combining MMLU, MMLU-Pro, GSM8K, MBPP+)
  hierarchical_combinations:
    # K-12 Level Mathematics
    mathematics_k12:
      - ["mmlu_math_mcq", "mmlu_math_tf", "gsm8k_math_long"]  # MMLU + GSM8K
      - ["gsm8k_math_long"]                                    # Pure GSM8K word problems
      - ["mmlu_math_mcq", "mmlu_math_tf"]                     # MMLU math theory only
    
    # K-12 Level Science (using AI2-ARC dataset)
    science_k12:
      - ["arc_science_mcq", "arc_science_tf"]                      # AI2-ARC MCQ + True/False (40 marks)
    
    # Undergraduate Level Mathematics
    mathematics_undergraduate:
      - ["mmlu_math_mcq", "mmlu_math_tf", "mmlu_pro_math_mcq", "gsm8k_math_long"]  # All datasets
      - ["mmlu_pro_math_mcq", "mmlu_pro_math_tf", "gsm8k_math_long"]              # MMLU-Pro + GSM8K
      - ["mmlu_math_mcq", "mmlu_math_tf", "mbpp_coding_long"]                     # MMLU + MBPP
    
    # Graduate Level Mathematics
    mathematics_graduate:
      - ["mmlu_pro_math_mcq", "mmlu_pro_math_tf", "mbpp_coding_long"]            # MMLU-Pro + MBPP
      - ["mmlu_pro_math_mcq", "mmlu_pro_math_tf", "mmlu_pro_math_research"]      # MMLU-Pro research
      - ["mbpp_coding_long", "mmlu_pro_math_research"]                           # MBPP + research
    
    # Undergraduate Level Physics
    physics_undergraduate:
      - ["mmlu_physics_mcq", "mmlu_physics_tf", "mmlu_pro_physics_mcq", "physics_long"]  # All datasets
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "physics_long"]                  # MMLU-Pro + problems
    
    # Graduate Level Physics
    physics_graduate:
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "mmlu_pro_physics_research"]     # MMLU-Pro research
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "physics_long"]                 # MMLU-Pro + problems
      - ["mmlu_pro_physics_mcq", "physics_research"]                                      # Research focused
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "gsm8k_math_long"]              # MMLU-Pro + math problems
    
    # Undergraduate Level Chemistry
    chemistry_undergraduate:
      - ["mmlu_chemistry_mcq", "mmlu_chemistry_tf", "mmlu_pro_chemistry_mcq", "chemistry_long"]  # All datasets
      - ["mmlu_pro_chemistry_mcq", "mmlu_pro_chemistry_tf", "chemistry_long"]                    # MMLU-Pro + problems
    
    # Graduate Level Chemistry
    chemistry_graduate:
      - ["mmlu_pro_chemistry_mcq", "mmlu_pro_chemistry_tf", "mmlu_pro_chemistry_research"]       # MMLU-Pro research
      - ["mmlu_pro_chemistry_mcq", "mmlu_pro_chemistry_tf", "chemistry_long"]                   # MMLU-Pro + problems
      - ["mmlu_pro_chemistry_mcq", "chemistry_research"]                                        # Research focused
    
    # Undergraduate Level Biology
    biology_undergraduate:
      - ["mmlu_biology_mcq", "mmlu_biology_tf", "mmlu_pro_biology_mcq", "biology_long"]  # All datasets
      - ["mmlu_pro_biology_mcq", "mmlu_pro_biology_tf", "biology_long"]                  # MMLU-Pro + problems
    
    # Graduate Level Biology
    biology_graduate:
      - ["mmlu_pro_biology_mcq", "mmlu_pro_biology_tf", "mmlu_pro_biology_research"]     # MMLU-Pro research
      - ["mmlu_pro_biology_mcq", "mmlu_pro_biology_tf", "biology_long"]                 # MMLU-Pro + problems
      - ["mmlu_pro_biology_mcq", "biology_research"]                                     # Research focused
      # Note: TF questions use PubMedQA (see dataset_overrides section)
    
    # Undergraduate Level Computer Science
    computer_science_undergraduate:
      - ["mmlu_cs_mcq", "mmlu_cs_tf", "mmlu_pro_cs_mcq", "mbpp_coding_long"]           # All datasets
      - ["mmlu_pro_cs_mcq", "mmlu_pro_cs_tf", "mbpp_coding_long"]                      # MMLU-Pro + MBPP
      - ["mbpp_coding_long", "cs_algorithm_long"]                                       # MBPP + algorithms
    
    # Graduate Level Computer Science
    computer_science_graduate:
      - ["mmlu_pro_cs_mcq", "mmlu_pro_cs_tf", "mbpp_coding_long", "cs_research"]       # All + research
      - ["mbpp_coding_long", "cs_research", "cs_implementation"]                        # MBPP + research
    
    # Undergraduate Level Engineering
    engineering_undergraduate:
      - ["mmlu_engineering_mcq", "mmlu_engineering_tf", "mmlu_pro_engineering_mcq", "engineering_long"]  # All datasets
      - ["mmlu_pro_engineering_mcq", "mmlu_pro_engineering_tf", "engineering_long"]                     # MMLU-Pro + problems
    
    # Graduate Level Engineering
    engineering_graduate:
      - ["mmlu_pro_engineering_mcq", "mmlu_pro_engineering_tf", "engineering_long"]                 # MMLU-Pro + problems
      - ["mmlu_pro_engineering_mcq", "mmlu_pro_engineering_tf"]                                     # MMLU-Pro only
    
    # K-12 Level Economics
    economics_k12:
      - ["mmlu_economics_mcq", "mmlu_economics_tf"]                                             # MMLU economics basics
      - ["mmlu_economics_mcq", "mmlu_economics_tf", "economics_basic_long"]                    # MMLU + basics
    
    # Undergraduate Level Economics
    economics_undergraduate:
      - ["mmlu_economics_mcq", "mmlu_economics_tf", "mmlu_pro_economics_mcq", "economics_long"]  # All datasets
      - ["mmlu_pro_economics_mcq", "mmlu_pro_economics_tf", "economics_long"]                    # MMLU-Pro + problems
    
    # Graduate Level Economics
    economics_graduate:
      - ["mmlu_pro_economics_mcq", "mmlu_pro_economics_tf", "economics_long"]               # MMLU-Pro + problems
      - ["mmlu_pro_economics_mcq", "mmlu_pro_economics_tf"]                                   # MMLU-Pro only
    
    # Undergraduate Level Psychology
    psychology_undergraduate:
      - ["mmlu_psychology_mcq", "mmlu_psychology_tf", "mmlu_pro_psychology_mcq", "psychology_long"]  # All datasets
      - ["mmlu_pro_psychology_mcq", "mmlu_pro_psychology_tf", "psychology_long"]                     # MMLU-Pro + problems
    
    # Graduate Level Psychology
    psychology_graduate:
      - ["mmlu_pro_psychology_mcq", "mmlu_pro_psychology_tf", "psychology_long"]             # MMLU-Pro + problems
