      - ["mmlu_pro_chemistry_mcq", "mmlu_pro_chemistry_tf", "chemistry_long"]                   # MMLU-Pro + problems
      - ["mmlu_pro_chemistry_mcq", "chemistry_research"]                                        # Research focused
    
    # K-12 Level Biology
    biology_k12:
