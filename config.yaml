# LaTeX template settings
latex:
  base_template: "templates/base_template.tex"
  output_dir: "output/latex_documents"
  pdf_output_dir: "output/pdf_documents"
  
  # Document metadata
  school_name: "CAMELBACK HIGH SCHOOL"
  course_number: "MTH-101"
  subject: "Basic Mathematics"
  term: "2023"

# IntegrityShield perturbation settings
integrity_shield:
  enabled: true
  perturbation_types:
    - "hidden_text"
    - "font_remapping"
    - "visual_overlay"
  hidden_text:
    color: "white"
    font_size: 8
    position_offset: [72, 72]
  font_remapping:
    unicode_mappings:
      "What is": "What is NOT"
      "True": "False"
  visual_overlay:
    opacity: 0.12
    position_tolerance: 6

# PDF generation settings
pdf_generation:
  validation_enabled: true
  cleanup_auxiliary_files: true
  max_retries: 3

# LLM configuration for MCQ to long-form conversion
llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.7
  max_tokens: 350
  enable_caching: true
  cache_file: "data/cache/llm_conversions.json"
  max_retries: 3
  timeout: 30

# Logging configuration
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  file: "logs/integrity_shield.log"
  rotation: "10 MB"
  retention: "30 days"

# Output directories
output:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  gold_labels_dir: "data/gold_labels"
  latex_dir: "output/latex_documents"
  pdf_dir: "output/pdf_documents"
  perturbed_dir: "output/perturbed_documents"
  logs_dir: "logs"
