    domain: "Computer Science"
    academic_level: "Graduate"
  
  # Engineering Hierarchical Mappings
  mmlu_engineering_undergrad:
    subjects: ["electrical_engineering", "engineering"]
    type: "stem"
    domain: "Engineering"
    academic_level: "Undergraduate"
  
  mmlu_engineering_grad:
