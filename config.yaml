# IntegrityShield Configuration

# Dataset sources
datasets:
  gsm8k_mcq:
    source: "local"
    path: "data/gsm_mcq"
    type: "math"
    format: "jsonl"
  
  mbpp_plus:
    source: "huggingface"
    repo: "Muennighoff/mbpp"
    config: "full"
    type: "coding"
    format: "dataset"
  
  mmlu_abstract_algebra:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "abstract_algebra"
    type: "social_science"
    format: "dataset"
  
  mmlu_all:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "all"
    type: "social_science"
    format: "dataset"
  
  mmlu_anatomy:
    source: "huggingface"
    repo: "cais/mmlu"
    config: "anatomy"
    type: "social_science"
    format: "dataset"

# Document generation settings
document_generation:
  total_documents: 40
  initial_batch: 5
  marks_per_document: 40
  
  # Question type combinations
  combinations:
    - ["mcq", "tf", "long"]
    - ["mcq", "tf"]
    - ["mcq", "long"]
    - ["mcq"]
    - ["tf", "long"]
    - ["tf"]
    - ["long"]
    - ["mixed"]

# LaTeX template settings
latex:
  base_template: "templates/base_template.tex"
  output_dir: "output/latex_documents"
  pdf_output_dir: "output/pdf_documents"
  
  # Document metadata
  school_name: "CAMELBACK HIGH SCHOOL"
  course_number: "MTH-101"
  subject: "Basic Mathematics"
  term: "2023"

# IntegrityShield perturbation settings
integrity_shield:
  enabled: true
  perturbation_types:
    - "hidden_text"
    - "font_remapping"
    - "visual_overlay"
  hidden_text:
    color: "white"
    font_size: 8
    position_offset: [72, 72]
  font_remapping:
    unicode_mappings:
      "What is": "What is NOT"
      "True": "False"
  visual_overlay:
    opacity: 0.12
    position_tolerance: 6

# PDF generation settings
pdf_generation:
  validation_enabled: true
  cleanup_auxiliary_files: true
  max_retries: 3

# Logging configuration
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  file: "logs/integrity_shield.log"
  rotation: "10 MB"
  retention: "30 days"

# Output directories
output:
  data_dir: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  gold_labels_dir: "data/gold_labels"
  latex_dir: "output/latex_documents"
  pdf_dir: "output/pdf_documents"
  perturbed_dir: "output/perturbed_documents"
  logs_dir: "logs"
