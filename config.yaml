# Document generation settings
document_generation:
  total_documents: 40
  initial_batch: 5
  marks_per_document: 40
  
  # Domain generation settings
  domain_generation:
    enabled: true  # Enable domain-specific papers
    use_hierarchical_system: true  # Use hierarchical academic level system
    domains_to_generate: [
      "mathematics", "physics", "chemistry", "biology",
      "computer_science", "engineering", "economics", "psychology", 
      "philosophy", "health", "business", "history", "geography",
      "sociology", "political_science", "religious_studies", 
      "machine_learning", "cybersecurity", "astronomy"
    ]
    academic_levels: ["K-12", "Undergraduate", "Graduate"]
    
    # Realistic academic level mappings for each domain
    domain_academic_levels:
      # Domains with K-12, Undergraduate, Graduate
      mathematics: ["K-12", "Undergraduate", "Graduate"]
      physics: ["K-12", "Undergraduate", "Graduate"]
      chemistry: ["K-12", "Undergraduate", "Graduate"]
      biology: ["K-12", "Undergraduate", "Graduate"]
      computer_science: ["K-12", "Undergraduate", "Graduate"]
      economics: ["K-12", "Undergraduate", "Graduate"]
      health: ["K-12", "Undergraduate", "Graduate"]
      history: ["K-12", "Undergraduate", "Graduate"]
      geography: ["K-12", "Undergraduate", "Graduate"]
      
      # Domains with Undergraduate, Graduate only (no K-12)
      engineering: ["Undergraduate", "Graduate"]
      psychology: ["Undergraduate", "Graduate"]
      philosophy: ["Undergraduate", "Graduate"]
      business: ["Undergraduate", "Graduate"]
      sociology: ["Undergraduate", "Graduate"]
      political_science: ["Undergraduate", "Graduate"]
      religious_studies: ["Undergraduate", "Graduate"]
      machine_learning: ["Undergraduate", "Graduate"]
      cybersecurity: ["Undergraduate", "Graduate"]
      
      # Domains with Graduate only (advanced subjects)
      astronomy: ["Graduate"]
    papers_per_domain_level: 1  # Generate 1 paper per domain-level combination
    use_legacy_combinations: false  # Use hierarchical combinations instead
  
  # Hierarchical domain combinations (combining MMLU, MMLU-Pro, GSM8K, MBPP+)
  hierarchical_combinations:
    # K-12 Level Mathematics
    mathematics_k12:
      - ["mmlu_math_mcq", "mmlu_math_tf", "gsm8k_math_long"]  # MMLU + GSM8K
      - ["gsm8k_math_long"]                                    # Pure GSM8K word problems
      - ["mmlu_math_mcq", "mmlu_math_tf"]                     # MMLU math theory only
    
    # Undergraduate Level Mathematics
    mathematics_undergraduate:
      - ["mmlu_math_mcq", "mmlu_math_tf", "mmlu_pro_math_mcq", "gsm8k_math_long"]  # All datasets
      - ["mmlu_pro_math_mcq", "mmlu_pro_math_tf", "gsm8k_math_long"]              # MMLU-Pro + GSM8K
      - ["mmlu_math_mcq", "mmlu_math_tf", "mbpp_coding_long"]                     # MMLU + MBPP
    
    # Graduate Level Mathematics
    mathematics_graduate:
      - ["mmlu_pro_math_mcq", "mmlu_pro_math_tf", "mbpp_coding_long"]            # MMLU-Pro + MBPP
      - ["mmlu_pro_math_mcq", "mmlu_pro_math_tf", "mmlu_pro_math_research"]      # MMLU-Pro research
      - ["mbpp_coding_long", "mmlu_pro_math_research"]                           # MBPP + research
    
    # K-12 Level Physics
    physics_k12:
      - ["mmlu_physics_mcq", "mmlu_physics_tf"]                 # MMLU physics only
      - ["mmlu_physics_mcq", "mmlu_physics_tf", "physics_long"] # MMLU + problems
    
    # Undergraduate Level Physics
    physics_undergraduate:
      - ["mmlu_physics_mcq", "mmlu_physics_tf", "mmlu_pro_physics_mcq", "physics_long"]  # All datasets
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "physics_long"]                  # MMLU-Pro + problems
    
    # Graduate Level Physics
    physics_graduate:
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "mmlu_pro_physics_research"]     # MMLU-Pro research
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "physics_long"]                 # MMLU-Pro + problems
      - ["mmlu_pro_physics_mcq", "physics_research"]                                      # Research focused
      - ["mmlu_pro_physics_mcq", "mmlu_pro_physics_tf", "gsm8k_math_long"]              # MMLU-Pro + math problems
    
    # K-12 Level Chemistry
    chemistry_k12:
      - ["mmlu_chemistry_mcq", "mmlu_chemistry_tf"]             # MMLU chemistry only
      - ["mmlu_chemistry_mcq", "mmlu_chemistry_tf", "chemistry_long"] # MMLU + problems
    
    # Undergraduate Level Chemistry
    chemistry_undergraduate:
      - ["mmlu_chemistry_mcq", "mmlu_chemistry_tf", "mmlu_pro_chemistry_mcq", "chemistry_long"]  # All datasets
      - ["mmlu_pro_chemistry_mcq", "mmlu_pro_chemistry_tf", "chemistry_long"]                    # MMLU-Pro + problems
    
    # Graduate Level Chemistry
    chemistry_graduate:
